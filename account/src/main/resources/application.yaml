spring:
  application:
    name: account

  config:
    import: optional:configserver:http://localhost:8071

  data:
    mongodb:
      uri: mongodb://localhost:27017/account_db

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9000/eureka/

info:
  app:
    name: Account Microservice
    description: This microservice handles account management operations.
    version: 1.0.0
    env:
      enabled: true

# Fixed: resilience4j (not resilince4j)
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
    instances:
      detailsForCustomerSupportApp:
        slidingWindowType: COUNT_BASED          # Type, not size
        slidingWindowSize: 10                    # Size as number
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 20000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true