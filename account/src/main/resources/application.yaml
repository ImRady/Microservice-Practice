spring:
  application:
    name: account

  config:
    import: optional:configserver:http://localhost:8071

  data:
    mongodb:
      uri: mongodb://localhost:27017/account_db

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  shutdown:
    enabled: true

  info:
    env:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9000/eureka/


info:
  app:
    name: Account Microservice
    description: This microservice handles account management operations.
    version: 1.0.0
    env:
      enabled: true


