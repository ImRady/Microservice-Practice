  version: "3.8"
  services:
    # Databases
    mongodb:
      image: mongo:latest
      container_name: mongodb
      ports:
        - "27017:27017"
      networks:
        - banknet
      volumes:
        - mongo_data:/data/db

    postgres:
      image: postgres:15
      container_name: postgres
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 1234
        POSTGRES_DB: card_db
      ports:
        - "5432:5432"
      networks:
        - banknet
      volumes:
        - postgres_data:/var/lib/postgresql/data

    configserver:
      image: bank/configserver:latest
      container_name: configserver
      ports:
        - "8071:8071"
      networks:
        - banknet
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8071/actuator/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 40s
      deploy:
        resources:
          limits:
            memory: 700M

    eurekaserver:
      image: bank/eurekaserver:latest
      container_name: eurekaserver
      ports:
        - "9000:9000"
      networks:
        - banknet   
      depends_on:
        configserver:
          condition: service_healthy
      deploy:
        restart_policy:
          condition: on-failure
          delay: 15s
          max_attempts: 3
          window: 120s
      environment:
        SPRING_PROFILES_ACTIVE: default
        SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8071/
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 40s

    account:
      image: bank/accountservice:latest
      container_name: account
      ports:
        - "8080:8080"
      networks:
        - banknet
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
        mongodb:
          condition: service_started
      deploy:
        restart_policy:
          condition: on-failure
          delay: 15s
          max_attempts: 3
          window: 120s
        resources:
          limits:
            memory: 700M
      environment:
        SPRING_PROFILES_ACTIVE: default
        SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8071/
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/account_db
        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/

    loan:
      image: bank/loanservice:latest
      container_name: loan
      ports:
        - "8090:8090"
      networks:
        - banknet
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
        mongodb:
          condition: service_started
      deploy:
        restart_policy:
          condition: on-failure
          delay: 15s
          max_attempts: 3
          window: 120s
        resources:
          limits:
            memory: 700M
      environment:
        SPRING_PROFILES_ACTIVE: default
        SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8071/
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/loan_db
        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/
        SERVER_PORT: 8090

    card:
      image: bank/cardservice:latest
      container_name: card
      ports:
        - "8070:8070"
      networks:
        - banknet
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
        postgres:
          condition: service_started
      deploy:
        restart_policy:
          condition: on-failure
          delay: 15s
          max_attempts: 3
          window: 120s
        resources:
          limits:
            memory: 700M
      environment:
        SPRING_PROFILES_ACTIVE: default
        SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8071/
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/card_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 1234
        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:9000/eureka/

  networks:
    banknet:
      driver: bridge

  volumes:
    mongo_data:
    postgres_data: